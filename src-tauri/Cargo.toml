[package]
name = "threadline"
version = "0.1.1"
edition = "2021"

[lib]
name = "threadline_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
atrium-api = { version = "0.25.8", default-features = false }
atrium-common = "0.1.4"
atrium-identity = "0.1.9"
atrium-oauth = { version = "0.1.7", default-features = false, features = ["reqwest"] }
atrium-xrpc = "0.12.4"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
jiff = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
regex = "1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_html_form = "0.2"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
