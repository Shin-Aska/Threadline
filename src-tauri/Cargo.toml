[package]
name = "threadline"
version = "1.0.0"
edition = "2021"

[lib]
name = "threadline_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
atrium-api = { version = "0.25.8", default-features = false }
atrium-common = "0.1.4"
atrium-identity = "0.1.9"
atrium-oauth = { version = "0.1.7", default-features = false, features = ["reqwest"] }
atrium-xrpc = "0.12.4"
base64 = "0.22"
dom_query = "0.27"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
jiff = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
regex = "1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_html_form = "0.2"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_16"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSSet", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord"] }
