name: Release
run-name: Release from ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Shin-Aska/Threadline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - id: version
        run: node scripts/release.mjs validate
      - name: Require immutable releases and an unused version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(gh api "repos/$GH_REPO/immutable-releases" --jq .enabled)" = true
          git ls-remote --exit-code --tags https://github.com/$GH_REPO.git "refs/tags/v$VERSION" && exit 1 || status=$?
          test "$status" = 2

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: prepare
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            bundles: deb,appimage
          - os: windows-2022
            platform: windows-x86_64
            bundles: nsis,msi
          - os: macos-15
            platform: macos-aarch64
            bundles: dmg
          - os: macos-15-intel
            platform: macos-x86_64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: npm ci
      - name: Build installers
        env:
          BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --ci --bundles "$BUNDLES" -- --locked
      - name: Collect installers
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/release.mjs collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [prepare, checks, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Validate complete asset set and write checksums
        run: node scripts/release.mjs checksums
      - name: Attest CI artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*
      - name: Verify provenance before publication
        run: |
          for file in release-assets/*; do
            gh attestation verify "$file" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Publish immutable release
        run: |
          test "$(gh api "repos/$GH_REPO/immutable-releases" --jq .enabled)" = true
          gh release create "v$VERSION" release-assets/* --draft \
            --target "$GITHUB_SHA" --title "Threadline v$VERSION" \
            --notes-file "docs/releases/v$VERSION.md"
          gh release edit "v$VERSION" --draft=false --latest
